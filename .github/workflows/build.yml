name: Build TWRP (template)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Create workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

      - name: Clone device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          git clone https://github.com/shivos-official/android_device_xiaomi_ginkgo.git -b android-12.1 device/xiaomi/ginkgo

      - name: Clone kernel
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          git clone https://github.com/shivos-official/android_kernel_xiaomi_ginkgo.git -b android-9.0 kernel/xiaomi/ginkgo || \
git clone https://github.com/shivos-official/android_kernel_xiaomi_ginkgo.git kernel/xiaomi/ginkgo

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_ginkgo-eng
          mka recoveryimage

      - uses: actions/upload-artifact@v4
        with:
          name: recovery
          path: ${{ github.workspace }}/twrp/out/target/product/ginkgo/recovery.img
